server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: light-food
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/light_food?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 500ms

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lightfood.pojo.entity
  configuration:
    map-underscore-to-camel-case: true

lightfood:
  jwt:
    secret: ${JWT_SECRET:light-food-dev-secret-change-me-please-0123456789abcdef}
    expire-hours: ${JWT_EXPIRE_HOURS:12}
  cache:
    redis-enabled: ${CACHE_REDIS_ENABLED:true}

logging:
  level:
    root: INFO
    com.lightfood: INFO
